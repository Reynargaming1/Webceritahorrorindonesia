<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pernyataan Cinta</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #fff;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #ff6b6b;
            animation: pulse 1.5s infinite;
        }
        p {
            font-size: 1.2em;
            margin: 10px 0;
        }
        .heart {
            font-size: 3em;
            color: #ff6b6b;
            animation: heartbeat 1s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        @keyframes pulse {
            0%, 100% { color: #ff6b6b; }
            50% { color: #ff8585; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❤️ Untukmu, yang Tercinta ❤️</h1>
        <p>Sejak aku mengenalmu, hidupku penuh warna.</p>
        <p>Aku ingin menghabiskan setiap detik bersamamu, melihat senyummu, dan mendengarkan tawamu.</p>
        <p>Kamu adalah segalanya bagiku. Maukah kamu menjadi cinta dalam hidupku?</p>
        <div class="heart">❤️</div>
    </div>
</body>
</html>
